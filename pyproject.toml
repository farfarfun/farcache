[build-system]
requires = [ "setuptools>=61",]
build-backend = "setuptools.build_meta"

[project]
name = "farcache"
version = "2.0.3"
description = "Lightweight function caching decorators for memory and disk"
readme = "README.md"
requires-python = ">=3.10"
keywords = [ "cache", "caching", "decorator", "memoize", "lru", "ttl", "diskcache", "pickle",]
dependencies = [ "cachebox>=5.0.1,<6", "diskcache>=5.6.3,<6",]
classifiers = ["Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "Operating System :: OS Independent", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3 :: Only", "Topic :: Software Development :: Libraries :: Python Modules", "Typing :: Typed"]
license = "MIT"
license-files = ["LICENSE"]

[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"
[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/farcache"
Releases = "https://github.com/farfarfun/farcache/releases"

[project.optional-dependencies]
dev = [ "coverage>=7.4", "mypy>=1.9", "ruff>=0.4",]

[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"
[tool.setuptools]

[tool.setuptools.package-data]
farcache = [ "py.typed",]

[tool.ruff]
target-version = "py310"
src = [ "src",]
# README snippets are illustrative; the formatter collapses them into shapes
# that read worse as documentation.
extend-exclude = [ "*.md",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B", "SIM", "RUF",]
# RUF001-003: the policy docstrings are bilingual, full-width CJK punctuation
# is intended. RUF022: __all__ is grouped by backend rather than sorted.
ignore = [ "RUF001", "RUF002", "RUF003", "RUF022",]

[tool.ruff.lint.per-file-ignores]
# The subTest closures are defined and called inside the same iteration, so
# late binding cannot bite.
"tests/**" = [ "B023",]

[tool.mypy]
python_version = "3.10"
files = [ "src",]
strict = true

[[tool.mypy.overrides]]
module = [ "cachebox.*", "diskcache.*",]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = [ "farcache",]
