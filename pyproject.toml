[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "farcache"
version = "2.0.4"
description = "Lightweight function caching decorators for memory and disk"
readme = "README.md"
requires-python = ">=3.10"
keywords = [ "cache", "caching", "decorator", "memoize", "lru", "ttl", "diskcache", "pickle",]
dependencies = [ "cachebox>=5.0.1,<6", "diskcache>=5.6.3,<6", "farlog>=1.1.7",]
classifiers = ["Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "Operating System :: OS Independent", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3 :: Only", "Topic :: Software Development :: Libraries :: Python Modules", "Typing :: Typed"]
license = "MIT"
license-files = ["LICENSE"]

[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"
[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/farcache"
Releases = "https://github.com/farfarfun/farcache/releases"

[project.optional-dependencies]
dev = [ "coverage>=7.4", "mypy>=1.9", "ruff>=0.4",]

[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"
[tool.hatch.build.targets.wheel]
packages = ["src/farcache"]

[tool.ruff]
target-version = "py310"
src = [ "src",]
# README 示例仅用于说明；格式化器会将其压缩成不利于阅读的形式。
extend-exclude = [ "*.md",]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B", "SIM", "RUF",]
# RUF001-003：规范 docstring 为双语，全角中文标点是有意使用的。
# RUF022：__all__ 按后端分组，而不是按字母排序。
ignore = [ "RUF001", "RUF002", "RUF003", "RUF022",]

[tool.ruff.lint.per-file-ignores]
# subTest 闭包在同一轮迭代内定义并调用，不会受到延迟绑定影响。
"tests/**" = [ "B023",]

[tool.mypy]
python_version = "3.10"
files = [ "src",]
strict = true

[[tool.mypy.overrides]]
module = [ "cachebox.*", "diskcache.*", "farlog.*",]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = [ "farcache",]
